[workspace]
resolver = "2"
members = ["examples/particle"]

[package]
name = "waterui-particle"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/particle"
description = "A GPU-accelerated particle system component for WaterUI"
keywords = ["particle", "effects", "waterui", "gpu", "simulation"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
# The mounted-runtime tests in `tests/e2e_semantics.rs`. They mount through
# `waterui-testing`, which pulls `hydrolysis` — and no hydrolysis or
# hydrolysis-m3 revision compiles against the pinned waterui revision yet
# (both still implement the retired `Scene2D` contract), so this target is
# the one piece of the crate that does not build under `--all-features`.
# When a hydrolysis revision lands that implements the new `SceneContent`
# contract, declare the host dev-deps and this builds.
host-e2e = []

[dependencies]
waterui-core = "0.5.0"
waterui-graphics = { version = "0.5.0", features = ["gpu"] }
bytemuck = { version = "1.23.1", features = ["derive"] }
encase = "0.13"
fastrand = "2.3"
num-traits = "0.2.19"

[dev-dependencies]
waterui = "0.5.0"
pollster = "0.4.0"

[patch.crates-io]
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
