[workspace]
resolver = "2"
members = ["examples/particle"]

[package]
name = "waterui-particle"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/particle"
description = "A GPU-accelerated particle system component for WaterUI"
keywords = ["particle", "effects", "waterui", "gpu", "simulation"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
# The mounted-runtime tests in `tests/e2e_semantics.rs`. They mount through
# `waterui-testing`, which pulls `hydrolysis` — and no hydrolysis or
# hydrolysis-m3 revision compiles against the pinned waterui revision yet
# (both still implement the retired `Scene2D` contract), so this target is
# the one piece of the crate that does not build under `--all-features`.
# When a hydrolysis revision lands that implements the new `SceneContent`
# contract, declare the host dev-deps and this builds.
host-e2e = []

[dependencies]
waterui-core = "0.5.0"
waterui-graphics = { version = "0.5.0", features = ["gpu"] }
shaderloom = "0.1.2"
bytemuck = { version = "1.23.1", features = ["derive"] }
encase = "0.13"
fastrand = "2.3"
pollster = "0.4.0"

[build-dependencies]
shaderloom = { version = "0.1.2", default-features = false, features = ["build"] }

[dev-dependencies]
waterui = "0.5.0"

# WebGPU API objects are !Send by construction, so a `GpuContent` that owns
# device resources cannot satisfy the trait's `Send` bound on wasm32 without
# wgpu's opt-in send-sync marker. The crate's only use of wgpu types is
# through `waterui_graphics::wgpu`; this edge exists solely to enable the
# feature for the whole graph.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }

[package.metadata.cargo-machete]
ignored = ["shaderloom", "wgpu"]

