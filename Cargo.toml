[package]
name = "waterui-particle"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/particle"
description = "High-performance GPU particle system for WaterUI"
keywords = ["particle", "gpu", "wgpu", "waterui", "effects"]
categories = ["gui", "graphics"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[dependencies]
waterui-core = { version = "0.3.0" }
waterui-graphics = { version = "0.3.0", features = ["gpu"] }
shaderloom = "0.1.0"
wgpu = "29.0.4"
bytemuck = { version = "1.25", features = ["derive"] }
encase = "0.12"
fastrand = "2.5"
num-traits = { version = "0.2", default-features = false }

[build-dependencies]
shaderloom = { version = "0.1.0", features = ["build"] }

[dev-dependencies]
pollster = "1.0"
waterui = "0.3.0"
waterui-testing = "0.3.0"

[package.metadata.cargo-machete]
ignored = ["shaderloom"]
