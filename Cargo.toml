[workspace]
members = ["examples/particle"]
resolver = "2"

[package]
name = "waterui-particle"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/particle"
description = "High-performance GPU particle system for WaterUI"
keywords = ["particle", "gpu", "wgpu", "waterui", "effects"]
categories = ["gui", "graphics"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[dependencies]
# Each requirement names the version the pinned revision provides; every bound
# moves to the released version in the commit that drops the pins below.
waterui-core = { version = "0.5.1" }
# The particle system is `GpuContent` end to end — the simulation is a wgpu
# compute pipeline and the draw is instanced rendering into an engine layer —
# so the Cherenkov GPU stack is an unconditional edge, not an optional one.
waterui-graphics = { version = "0.5.1", features = ["gpu"] }
shaderloom = { version = "0.1.2", default-features = false, features = ["runtime"] }
# `wgpu` is named through `waterui_graphics::wgpu`, the re-export of the exact
# wgpu the engine links, so the two version bounds cannot diverge.
bytemuck = { version = "1.25", features = ["derive"] }
encase = "0.12"
glam = { version = "0.33", features = ["encase-012", "bytemuck"] }
fastrand = "2.5"
num-traits = { version = "0.2", default-features = false }

[build-dependencies]
shaderloom = { version = "0.1.2", default-features = false, features = ["build"] }

[dev-dependencies]
pollster = "1.0"
waterui = "0.5.2"
waterui-testing = "0.5.1"

[package.metadata.cargo-machete]
ignored = ["shaderloom"]

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui `dev`
# (e76ad1e631d440ba5caf29218fadba6cbd18ad50). Cherenkov, filtrate and
# hydrolysis live in that tree, so those requirements use the same revision.
# Only the entries this graph actually resolves are listed.
[patch.crates-io]
# The crate under test stands in for the published `waterui-particle` the
# facade names as an optional dependency; without this entry that requirement
# resolves to the released registry crate and the graph carries two
# particles.
waterui-particle = { path = "." }

cherenkov = { git = "https://github.com/water-rs/waterui", rev = "e76ad1e631d440ba5caf29218fadba6cbd18ad50" }
