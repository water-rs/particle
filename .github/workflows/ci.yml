name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      # `shaderloom` compiles WGSL to DXIL on Windows through `dxc`
      - name: Install DirectX Shader Compiler
        if: runner.os == 'Windows'
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - uses: Swatinem/rust-cache@v2
      # The example's `dev` feature turns on the framework's dynamic linking,
      # which links the whole framework into one dylib; on Windows that trips
      # MSVC's 65535-object library limit (LNK1189). The example builds with its
      # default features, and `--all-features` stays on the component itself.
      - run: cargo test -p waterui-particle --all-targets --all-features
      - run: cargo check --workspace --all-targets

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux dependencies
        uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p waterui-particle --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux dependencies
        uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p waterui-particle --all-features
      - run: cargo check --workspace
